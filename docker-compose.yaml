services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    restart: always
    command:
      - start-dev
      - --import-realm
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${HOST_ADDRESS}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /identity

    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data

  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    extra_hosts:
      - "host.docker.internal:${HOST_ADDRESS}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/dist:/usr/share/nginx/html:ro

  litechess-app:
    image: trymad/litechess-modulith:0.5
    restart: always
    environment:
      KEYCLOAK_REALM_URL: https://${HOST_ADDRESS}/identity/realms/${KEYCLOAK_REALM}
      KEYCLOAK_JWK_URL: http://keycloak:8080/identity/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

      MONGODB_HOST: mongo
      MONGODB_PORT: "${MONGO_PORT}"
      MONGODB_DATABASE: ${MONGO_DATABASE}
      MONGODB_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_AUTH_DB: ${MONGODB_AUTH_DB} 

      POSTGRES_URL: jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT} 

      CORS_ALLOWED_ORIGINS: https://${HOST_ADDRESS}
      

    depends_on:
      - postgres
      - mongo
      - keycloak
    ports:
      - "${SERVER_PORT}:8080"


volumes:
  postgres_data:
  keycloak_data:
  mongo_data:
