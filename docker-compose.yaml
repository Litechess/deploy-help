services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    restart: always
    command:
      - start-dev
      - --import-realm
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: identity.${HOST_ADDRESS}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge

    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data

  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/dist:/usr/share/nginx/html:ro
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"  
      - "${MINIO_WEB_PORT}:9001"   
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_SERVER_URL: https://s3.localhost
      MINIO_BROWSER_REDIRECT_URL: https://s3-console.localhost
    command: server /data --console-address ":9001"
    extra_hosts:
      - "s3.localhost:host-gateway"
      - "s3-console.localhost:host-gateway"
    volumes:
      - minio-data:/data

  litechess-app:
    image: litechess-modulith:latest
    restart: always
    environment:
      KEYCLOAK_REALM_URL: https://identity.${HOST_ADDRESS}/realms/${KEYCLOAK_REALM}
      KEYCLOAK_JWK_URL: https://identity.${HOST_ADDRESS}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs

      MONGODB_HOST: mongo
      MONGODB_PORT: "${MONGO_PORT}"
      MONGODB_DATABASE: ${MONGO_DATABASE}
      MONGODB_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGODB_AUTH_DB: ${MONGODB_AUTH_DB} 

      POSTGRES_URL: jdbc:postgresql://postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${SERVER_PORT} 

      CORS_ALLOWED_ORIGINS: https://${HOST_ADDRESS}

      S3_URL: https://s3.${HOST_ADDRESS}
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}

    
    extra_hosts:
      - "s3.localhost:host-gateway"
      - "identity.localhost:host-gateway"
  
    depends_on:
      - postgres
      - mongo
      - keycloak
    ports:
      - "${SERVER_PORT}:8080"


volumes:
  postgres_data:
  keycloak_data:
  minio-data:
  mongo_data:
